services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env          # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped  # 서버가 재부팅되어도 자동으로 다시 실행된다.
    env_file: .env
    ports:
      # 외부 포트는 .env의 API_PORT로 바꿀 수 있다(기본 80). http://<퍼블릭 IP>:<API_PORT>/docs 로 접속
      - "${API_PORT:-80}:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # 테스트 전용 DB: docker compose --profile test up -d test-db
  # 데이터를 메모리(tmpfs)에만 두며 운영 DB와 분리되어 있다. 로컬(127.0.0.1)에서만 접속할 수 있다.
  test-db:
    image: postgres:16
    profiles: ["test"]
    environment:
      POSTGRES_USER: board
      POSTGRES_PASSWORD: board-password
      POSTGRES_DB: board_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  db-data:
