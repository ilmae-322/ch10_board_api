services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env          # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped  # 서버가 재부팅되어도 자동으로 다시 실행된다.
    env_file: .env
    ports:
      - "80:8000"            # http://<퍼블릭 IP>/docs 로 접속
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
