[project]
name = "board-api"
version = "0.1.0"
description = "FastAPI + SQLAlchemy + PostgreSQL 기반 RESTful 게시판 API (JWT 인증/인가)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 앱의 DB 엔진(연결 풀)을 테스트 전체에서 하나의 이벤트 루프로 공유한다.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
